name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'npm/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, 'release/**']
    paths:
      - 'npm/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    name: Unit tests (WJTTC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # `shell: bash` turns on pipefail: a failing test fails this step.
      - name: Run unit tests (preflight + sdk)
        shell: bash
        run: bun test tests/preflight.test.ts tests/sdk.test.ts 2>&1 | tee test-output.txt

      - name: Upload test output for the TAF receipt
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: taf-test-output
          path: npm/test-output.txt
          overwrite: true

      - name: Engine floor gate
        run: node scripts/check-engines.mjs  # engines.node == the lowest Node in node-compat

  # TAF receipt: one per push to main, red runs included (FAILED), saved to the
  # taf-receipts branch by taf-git's receipt job, the only job that writes.
  receipt:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: Wolfe-Jam/taf-git/.github/workflows/receipt.yml@v3.0.1
    with:
      artifact-name: taf-test-output
      test-output-file: test-output.txt
      test-result: ${{ needs.test.result }}

  node-compat:
    name: Node ${{ matrix.node }} install sanity
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun (for build)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install + build (verifies package loads on Node ${{ matrix.node }})
        run: |
          bun install --frozen-lockfile
          bun run build
          node -e "import('./dist/index.js').then(m => { if (!m.slash) throw new Error('missing slash export'); console.log('OK: slash-tokens loads on Node ${{ matrix.node }}'); })"
