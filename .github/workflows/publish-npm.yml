name: 📦 npm Publish (OIDC)

# Publishes slash-tokens (the npm/ folder) to npm through OIDC Trusted
# Publishing when a GitHub release is published: no npm token in this repo, no
# 2FA prompt, and npm adds a provenance statement linking the package to this
# workflow run.
#
# npm side (once, by the package owner): npmjs.com → slash-tokens → Settings →
# Trusted Publisher → GitHub Actions: Wolfe-Jam/slash-tokens, workflow
# publish-npm.yml, environment npm. The filename must match exactly.
#
# If the version is already on npm (published by hand), the job stops green.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v5

      - name: package.json version == release tag
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PV=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PV" ] || { echo "::error::package.json $PV != tag $TAG"; exit 1; }

      - name: Already on npm?
        id: exists
        run: |
          VER=$(node -p "require('./package.json').version")
          if curl -sf -o /dev/null "https://registry.npmjs.org/slash-tokens/${VER}"; then
            echo "::notice::slash-tokens ${VER} is already on npm; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing needs npm 11.5.1 or later; Node 24 ships it.
      - uses: actions/setup-node@v5
        if: steps.exists.outputs.skip != 'true'
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # prepublishOnly runs the build (tsc + bun build).
      - uses: oven-sh/setup-bun@v2
        if: steps.exists.outputs.skip != 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.exists.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Unit tests
        if: steps.exists.outputs.skip != 'true'
        run: bun test   # the integration tests run only with SLASH_LIVE=1

      - name: npm publish (OIDC Trusted Publishing)
        if: steps.exists.outputs.skip != 'true'
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --access public

      # npm can take a few minutes to serve a new version (faf-cli 8.11.1).
      - name: Confirm the version is on npm
        if: steps.exists.outputs.skip != 'true'
        run: |
          VER=$(node -p "require('./package.json').version")
          for _ in $(seq 1 100); do
            curl -sf -o /dev/null "https://registry.npmjs.org/slash-tokens/${VER}" && { echo "npm serves slash-tokens ${VER}"; exit 0; }
            sleep 6
          done
          echo "::error::slash-tokens ${VER} not served by npm after 10 minutes"; exit 1
